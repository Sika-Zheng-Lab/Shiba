name: Bump Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New version (vMAJOR.MINOR.PATCH); release date is edited separately'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: bump-version
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update only release labels
        env:
          NEW_VERSION: ${{ inputs.version }}
        run: |
          python scripts/update_version.py "$NEW_VERSION"
          python scripts/update_version.py --check
      - name: Commit and push
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "bump: $(cat VERSION)"
            git push origin HEAD:develop
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # GITHUB_TOKEN pushes do not start a second push workflow.
  validate:
    needs: bump
    uses: ./.github/workflows/test.yaml
    with:
      ref: ${{ needs.bump.outputs.sha }}
    secrets: inherit
