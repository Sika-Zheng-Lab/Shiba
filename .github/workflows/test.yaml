name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy scikit-learn statsmodels plotly matplotlib seaborn pyyaml coverage

      - name: Run tests with coverage
        working-directory: src
        run: |
          coverage run --source=. -m unittest discover -s ../test -v
          coverage xml -o ../coverage.xml
          coverage report --format=markdown >> $GITHUB_STEP_SUMMARY

      - name: Verify coverage file exists
        run: |
          echo "Looking for coverage.xml..."
          ls -la coverage.xml || echo "NOT FOUND in root"
          head -5 coverage.xml || true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
