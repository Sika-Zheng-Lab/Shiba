name: Check Version Labels

on:
  push:
    branches: [develop]
    paths: [VERSION]
  pull_request:
    branches: [main, develop]
    paths: [VERSION]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/update_version.py --check
