name: shiba
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.12
  - numpy=2.2
  - pandas=2.3
  - scipy=1.15
  - scikit-learn=1.6
  - statsmodels=0.14
  - plotly=6.3
  - matplotlib-base=3.10
  - seaborn=0.13
  - pyyaml=6.0
  - openpyxl=3.1
  - pysam=0.23
  - snakemake-minimal=9.13
  - tosa=1.0.0
  - stringtie=3.0
  - subread=2.1
  - samtools=1.22
  - r-base=4.5
  - r-glmmtmb=1.1.13
  # Match the TMB version used to build this glmmTMB package.
  - r-tmb=1.9.19
  - r-jsonlite=2.0
  - bioconductor-deseq2=1.50
  - r-data.table=1.17
  - r-locfit
  - git
  - pip
